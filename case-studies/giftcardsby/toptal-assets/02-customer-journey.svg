<svg width="2400" height="1180" viewBox="0 0 2400 1180" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08111F"/><stop offset="1" stop-color="#10203A"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#3E7BD0" stop-opacity="0.42"/><stop offset="1" stop-color="#3E7BD0" stop-opacity="0"/></radialGradient>
</defs>
<rect width="2400" height="1180" fill="url(#bg)"/>
<ellipse cx="2060" cy="120" rx="1000" ry="1000" fill="url(#glow)"/>
<rect x="170" y="150" width="34" height="9" rx="4" fill="#3E7BD0"/><rect x="212" y="150" width="34" height="9" rx="4" fill="#F4C81E"/><rect x="254" y="150" width="34" height="9" rx="4" fill="#9BC0F7"/>
<text x="170" y="216" font-family="IBM Plex Mono" font-weight="500" font-size="24" letter-spacing="6" fill="#9BC0F7">THE MERCHANT JOURNEY</text>
<text x="168" y="310" font-family="Space Grotesk" font-weight="700" font-size="76" letter-spacing="-2" fill="#FFFFFF">One product, five steps.</text>
<text x="170" y="378" font-family="Inter" font-weight="400" font-size="30" fill="#B8C3D7">From sign-up to a card someone can buy, send and redeem — the platform carries everything else.</text>
<line x1="376" y1="640" x2="2024" y2="640" stroke="#3E7BD0" stroke-opacity="0.32" stroke-width="4"/>
<circle cx="376" cy="640" r="56" fill="#10203A" stroke="#3E7BD0" stroke-width="3"/><text x="376" y="658" text-anchor="middle" font-family="Space Grotesk" font-weight="700" font-size="50" fill="#9BC0F7">1</text><text x="376" y="780" text-anchor="middle" font-family="Space Grotesk" font-weight="500" font-size="34" fill="#FFFFFF">Sign up</text><text x="376" y="832" text-anchor="middle" font-family="Inter" font-weight="400" font-size="24" fill="#B8C3D7"><tspan x="376" dy="0">Email + basics —</tspan><tspan x="376" dy="32">verify and you’re in.</tspan></text><circle cx="788" cy="640" r="56" fill="#10203A" stroke="#3E7BD0" stroke-width="3"/><text x="788" y="658" text-anchor="middle" font-family="Space Grotesk" font-weight="700" font-size="50" fill="#9BC0F7">2</text><text x="788" y="780" text-anchor="middle" font-family="Space Grotesk" font-weight="500" font-size="34" fill="#FFFFFF">Design the card</text><text x="788" y="832" text-anchor="middle" font-family="Inter" font-weight="400" font-size="24" fill="#B8C3D7"><tspan x="788" dy="0">Brand, value, message,</tspan><tspan x="788" dy="32">with a live preview.</tspan></text><circle cx="1200" cy="640" r="56" fill="#10203A" stroke="#3E7BD0" stroke-width="3"/><text x="1200" y="658" text-anchor="middle" font-family="Space Grotesk" font-weight="700" font-size="50" fill="#9BC0F7">3</text><text x="1200" y="780" text-anchor="middle" font-family="Space Grotesk" font-weight="500" font-size="34" fill="#FFFFFF">Publish storefront</text><text x="1200" y="832" text-anchor="middle" font-family="Inter" font-weight="400" font-size="24" fill="#B8C3D7"><tspan x="1200" dy="0">A branded page</tspan><tspan x="1200" dy="32">customers buy from.</tspan></text><circle cx="1612" cy="640" r="56" fill="#10203A" stroke="#3E7BD0" stroke-width="3"/><text x="1612" y="658" text-anchor="middle" font-family="Space Grotesk" font-weight="700" font-size="50" fill="#9BC0F7">4</text><text x="1612" y="780" text-anchor="middle" font-family="Space Grotesk" font-weight="500" font-size="34" fill="#FFFFFF">Sell</text><text x="1612" y="832" text-anchor="middle" font-family="Inter" font-weight="400" font-size="24" fill="#B8C3D7"><tspan x="1612" dy="0">Customer picks a value,</tspan><tspan x="1612" dy="32">pays, and sends.</tspan></text><circle cx="2024" cy="640" r="56" fill="#10203A" stroke="#3E7BD0" stroke-width="3"/><text x="2024" y="658" text-anchor="middle" font-family="Space Grotesk" font-weight="700" font-size="50" fill="#9BC0F7">5</text><text x="2024" y="780" text-anchor="middle" font-family="Space Grotesk" font-weight="500" font-size="34" fill="#FFFFFF">Deliver &amp; redeem</text><text x="2024" y="832" text-anchor="middle" font-family="Inter" font-weight="400" font-size="24" fill="#B8C3D7"><tspan x="2024" dy="0">Recipient gets it;</tspan><tspan x="2024" dy="32">the merchant redeems.</tspan></text>
<text x="1200" y="1070" text-anchor="middle" font-family="Inter" font-weight="400" font-size="25" fill="#8290A6">Behind those five steps the platform runs issuance, payments, buyer &amp; recipient comms, redemption, settlement and reporting — out of sight.</text>
</svg>